name: app-center

# ==============================================================================
# AI 运营管理平台（app-center）生产级容器编排
# 6 个独立业务镜像 + 1 个 MySQL 8.0（三逻辑库：mgmt / exec / repo）= 10 个容器
#   1. app-center-web                 (Nginx + Vite SPA)
#   2. app-center-management          (管理系统后端)
#   3. app-center-repositories        (四大自建仓库：skill / plugin / mcp / agent)
#   4. app-center-executor            (能力执行与治理编排核心，无外部产品凭据)
#   5. app-center-connector-dify      (独立 Dify 适配服务，可单独随 Dify 升级)
#   6. app-center-connector-ragflow   (独立 RAGFlow 适配服务，可单独随 RAGFlow 升级)
#   7. mysql:8.0.39                   (单实例三逻辑库 + 三账号隔离)
# ==============================================================================

services:
  mysql:
    image: mysql:8.0.39
    container_name: app-center-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ac_root_change_me}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max-connections=200
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-13306}:3306"
    networks:
      - internal_net
      - db_local_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  connector-dify:
    build:
      context: ..
      dockerfile: docker/Dockerfile.connector-dify
    image: app-center-connector-dify:${DIFY_CONNECTOR_TAG:-1.7.1}
    container_name: app-center-connector-dify
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?请设置 INTERNAL_TOKEN}
      DIFY_ADAPTER_VERSION: ${DIFY_ADAPTER_VERSION:-1.7.1}
      DIFY_API_BASE: ${DIFY_API_BASE:-}
      DIFY_CONSOLE_TOKEN: ${DIFY_CONSOLE_TOKEN:-}
      DIFY_CONSOLE_EMAIL: ${DIFY_CONSOLE_EMAIL:-}
      DIFY_CONSOLE_PASSWORD: ${DIFY_CONSOLE_PASSWORD:-}
      DIFY_WORKSPACE_ID: ${DIFY_WORKSPACE_ID:-}
      DIFY_PLUGIN_DAEMON_BASE: ${DIFY_PLUGIN_DAEMON_BASE:-}
      DIFY_PLUGIN_DAEMON_KEY: ${DIFY_PLUGIN_DAEMON_KEY:-}
      DIFY_OWNER_ACCOUNT_MAP: ${DIFY_OWNER_ACCOUNT_MAP:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - connector_net
      - outbound_net

  connector-ragflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile.connector-ragflow
    image: app-center-connector-ragflow:${RAGFLOW_CONNECTOR_TAG:-0.22.1}
    container_name: app-center-connector-ragflow
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4322
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?请设置 INTERNAL_TOKEN}
      RAGFLOW_ADAPTER_VERSION: ${RAGFLOW_ADAPTER_VERSION:-0.22.1}
      RAGFLOW_API_BASE: ${RAGFLOW_API_BASE:-}
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY:-}
      RAGFLOW_TENANT_ID: ${RAGFLOW_TENANT_ID:-}
      RAGFLOW_EXTERNAL_ENDPOINT: ${RAGFLOW_EXTERNAL_ENDPOINT:-}
      RAGFLOW_OWNER_ACCOUNT_MAP: ${RAGFLOW_OWNER_ACCOUNT_MAP:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - connector_net
      - outbound_net

  repo-skill:
    build:
      context: ..
      dockerfile: docker/Dockerfile.repositories
    image: app-center-repositories:${APP_VERSION:-1.0.0}
    container_name: app-center-repo-skill
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4311
      REPO_SERVICE: skill
      APP_DATA_DIR: /data/skill
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?请设置 INTERNAL_TOKEN}
      STORAGE_DRIVER: mysql
      MYSQL_URL: mysql://ac_repo:${MYSQL_REPO_PASSWORD:-ac_repo_change_me}@mysql:3306/app_center_repo
    volumes:
      - repo_skill_data:/data/skill
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal_net

  repo-plugin:
    image: app-center-repositories:${APP_VERSION:-1.0.0}
    container_name: app-center-repo-plugin
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4312
      REPO_SERVICE: plugin
      APP_DATA_DIR: /data/plugin
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?请设置 INTERNAL_TOKEN}
      STORAGE_DRIVER: mysql
      MYSQL_URL: mysql://ac_repo:${MYSQL_REPO_PASSWORD:-ac_repo_change_me}@mysql:3306/app_center_repo
    volumes:
      - repo_plugin_data:/data/plugin
    depends_on:
      mysql:
        condition: service_healthy
      repo-skill:
        condition: service_started
    networks:
      - internal_net

  repo-mcp:
    image: app-center-repositories:${APP_VERSION:-1.0.0}
    container_name: app-center-repo-mcp
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4313
      REPO_SERVICE: mcp
      APP_DATA_DIR: /data/mcp
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?请设置 INTERNAL_TOKEN}
      STORAGE_DRIVER: mysql
      MYSQL_URL: mysql://ac_repo:${MYSQL_REPO_PASSWORD:-ac_repo_change_me}@mysql:3306/app_center_repo
    volumes:
      - repo_mcp_data:/data/mcp
    depends_on:
      mysql:
        condition: service_healthy
      repo-skill:
        condition: service_started
    networks:
      - internal_net

  repo-agent:
    image: app-center-repositories:${APP_VERSION:-1.0.0}
    container_name: app-center-repo-agent
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4314
      REPO_SERVICE: agent
      APP_DATA_DIR: /data/agent
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?请设置 INTERNAL_TOKEN}
      STORAGE_DRIVER: mysql
      MYSQL_URL: mysql://ac_repo:${MYSQL_REPO_PASSWORD:-ac_repo_change_me}@mysql:3306/app_center_repo
    volumes:
      - repo_agent_data:/data/agent
    depends_on:
      mysql:
        condition: service_healthy
      repo-skill:
        condition: service_started
    networks:
      - internal_net

  executor:
    build:
      context: ..
      dockerfile: docker/Dockerfile.executor
    image: app-center-executor:${APP_VERSION:-1.0.0}
    container_name: app-center-executor
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4310
      APP_DATA_DIR: /data/executor
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?请设置 INTERNAL_TOKEN}
      STORAGE_DRIVER: mysql
      MYSQL_URL: mysql://ac_exec:${MYSQL_EXEC_PASSWORD:-ac_exec_change_me}@mysql:3306/app_center_exec
      CAPABILITY_STRICT_UPSTREAM: ${CAPABILITY_STRICT_UPSTREAM:-1}
      CAPABILITY_EVIDENCE_FILE: ${CAPABILITY_EVIDENCE_FILE:-}
      SKILL_URL: http://repo-skill:4311
      PLUGIN_URL: http://repo-plugin:4312
      MCP_URL: http://repo-mcp:4313
      AGENT_URL: http://repo-agent:4314
      MANAGEMENT_URL: http://management:4300
      MANAGEMENT_HEALTH_URL: http://management:4300/healthz
      DIFY_CONNECTOR_URL: http://connector-dify:4321
      RAGFLOW_CONNECTOR_URL: http://connector-ragflow:4322
      DIFY_INSTALL_ACCOUNT: ${DIFY_INSTALL_ACCOUNT:-}
    volumes:
      - executor_data:/data/executor
    depends_on:
      mysql:
        condition: service_healthy
      connector-dify:
        condition: service_healthy
      connector-ragflow:
        condition: service_healthy
      repo-skill:
        condition: service_healthy
      repo-plugin:
        condition: service_healthy
      repo-mcp:
        condition: service_healthy
      repo-agent:
        condition: service_healthy
    networks:
      - internal_net
      - connector_net

  management:
    build:
      context: ..
      dockerfile: docker/Dockerfile.management
    image: app-center-management:${APP_VERSION:-1.0.0}
    container_name: app-center-management
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4300
      APP_DATA_DIR: /data/management
      TRUST_PROXY: "1"
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?请设置 INTERNAL_TOKEN}
      STORAGE_DRIVER: mysql
      MYSQL_URL: mysql://ac_mgmt:${MYSQL_MGMT_PASSWORD:-ac_mgmt_change_me}@mysql:3306/app_center_mgmt
      CAPABILITY_URL: http://executor:4310
    volumes:
      - management_data:/data/management
    depends_on:
      mysql:
        condition: service_healthy
      executor:
        condition: service_healthy
    networks:
      - edge_net
      - internal_net

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: app-center-web:${APP_VERSION:-1.0.0}
    container_name: app-center-web
    restart: unless-stopped
    ports:
      - "${APP_CENTER_PORT:-8088}:80"
    depends_on:
      management:
        condition: service_healthy
    networks:
      - edge_net

volumes:
  mysql_data:
  management_data:
  executor_data:
  repo_skill_data:
  repo_plugin_data:
  repo_mcp_data:
  repo_agent_data:

networks:
  edge_net:
    driver: bridge
  internal_net:
    driver: bridge
    internal: true
  connector_net:
    driver: bridge
    internal: true
  outbound_net:
    driver: bridge
  db_local_net:
    driver: bridge
