                properties:
                  nextCursor: {type: string, nullable: true, minLength: 1, maxLength: 200}
                  items: {type: array, items: {$ref: '#/components/schemas/KeyRegistrationMetadata'}}
        '403': {description: 当前身份无读取权限}
        '501': {description: UPSTREAM_UNSUPPORTED，登记候选适配未实现}
  /key-registrations/{registrationId}:
    get:
      operationId: getKeyRegistrationForAction
