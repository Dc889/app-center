      parameters:
        - {name: registrationId, in: path, required: true, schema: {type: string}}
        - $ref: '#/components/parameters/Account'
        - $ref: '#/components/parameters/Org'
      responses:
        '200':
          description: 仅当前响应展示，禁止日志、工单、审计持久保存。
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {type: object, required: [secret], properties: {secret: {type: string, minLength: 1}}}
        '404': {description: 登记不存在或无领取权}
        '409': {description: REVEAL_UNAVAILABLE，已消费、过期或明文已不可用}
