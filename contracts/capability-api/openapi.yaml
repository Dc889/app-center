                type: object
                required: [items, asOf]
                properties:
                  asOf: {type: string, format: date-time}
                  items:
                    type: array
                    items:
                      type: object
                      required: [ticketType, ticketTypeVersion, action, variant, state, reasonCode, checkedAt]
                      properties:
                        ticketType: {type: string}
                        ticketTypeVersion: {type: string}
                        action: {type: string}
                        variant: {type: string, nullable: true}
                        state: {type: string, enum: [verified, unverified, unsupported]}
                        reasonCode: {type: string}
                        checkedAt: {type: string, format: date-time, nullable: true}
        '403': {description: 服务身份无效}
        '503': {description: 核验记录暂不可读取}
  /executions:
    post:
      operationId: submitExecution
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionRequest'
      responses:
        '202':
          description: 首次接单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionState'
        '200':
          description: 同一执行标识的重复请求
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionState'
        '400':
          description: 字段或动作不合法
        '409':
          description: 同一标识内容不同，或同一工单已有未结束的执行
  /executions/{executionId}:
    get:
      operationId: getExecution
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          description: 当前执行状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionState'
        '404':
          description: 没有这个执行标识
  /executions/{executionId}/cancel:
    post:
      operationId: cancelExecution
      description: 目标契约，当前本地执行器尚未实现。组件须与交付串行，必要时先调管理端delivery-checks关闭检查；只有确定不会继续产生未确认副作用才可返回cancelled。丢失响应后仍用原ID查询。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200':
          description: 当前执行，不能用HTTP成功代替业务取消确认
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionState'}
        '403': {description: 无服务权限}
        '404': {description: 原执行或接口不存在，不等于没有副作用}
        '409': {description: 在途、未知、已发生副作用或已经结束，查询原执行}
        '501': {description: 部署明确不支持取消}
        '503': {description: 暂不可用，保持查证}
  /executions/{executionId}/account-consistency:
    get:
      operationId: getAccountConsistency
      description: 只读查询ACC原执行已完成的产品查证；不得触发补偿。封存、基线与身份修订语义见account-recovery.md。真实执行器尚未实现此扩展，不支持时保留目标限制。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          description: 当前查证证明；仅restored加sealed且逐项匹配审批前基线可用于解锁。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountRestorationProof'}
        '404': {description: 原执行或查证证明不存在，不能当作无副作用}
        '501': {description: 部署不支持账号查证，保持限制}
        '503': {description: 产品查证暂不可用，保持限制}
  /catalog:
    get:
      operationId: listResourceCatalog
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [skill, plugin, mcp, agent]
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: workspaceId, in: query, schema: {type: string, maxLength: 200}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 200}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - name: action
          in: query
          description: agent支持republish/withdraw_app，skill支持withdraw_skill，mcp支持unbind_mcp/isolate_mcp/withdraw_mcp，其他组合400。按可信调用身份的动作申请资格筛选，普通可见/下载/绑定权限不代表处置资格。MCP解绑允许active/isolated/withdrawn，隔离仅active，下架active/isolated。不支持返回501，不回退普通目录。
          schema: {type: string, enum: [republish, withdraw_app, withdraw_skill, unbind_mcp, isolate_mcp, withdraw_mcp]}
        - name: X-Account
          in: header
          required: true
          schema:
            type: string
        - name: X-Org
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 当前身份可见的目录；管理候选必须在actions中明确包含请求动作。数据结构按种类见能力组件开发第3节。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPage'
        '501':
          description: 当前部署尚未接通的种类或管理候选适配，返回UPSTREAM_UNSUPPORTED
  /catalog/{kind}/{resourceId}:
    get:
      operationId: getCatalogResource
      security: [{bearerAuth: []}]
      parameters:
        - {name: kind, in: path, required: true, schema: {type: string, enum: [skill, plugin, mcp, agent]}}
        - {name: resourceId, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: version, in: query, schema: {type: string}}
        - name: action
          in: query
          description: agent支持republish/withdraw_app，skill支持withdraw_skill，mcp支持unbind_mcp/isolate_mcp/withdraw_mcp，规则与列表一致。详情每次重新检查当前身份资格，actions不能沿用浏览器或旧列表结论。withdraw_skill须有当前data.version且未下架；MCP旧绑定清理可选择有解绑资格的已隔离/下架条目。
          schema: {type: string, enum: [republish, withdraw_app, withdraw_skill, unbind_mcp, isolate_mcp, withdraw_mcp]}
        - {name: X-Account, in: header, required: true, schema: {type: string}}
        - {name: X-Org, in: header, required: true, schema: {type: string}}
      responses:
        '200':
          description: 与列表项目结构一致；智能体data含appId/workspaceId，变更再发布还需原publicationVersionId/workflowSnapshotId/policyRef。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogEntry'}
        '403': {description: 当前身份无此管理操作资格}
        '404': {description: 资源不存在或不可见}
        '501': {description: UPSTREAM_UNSUPPORTED，来源或动作资格适配未实现}
  /execution-contexts/MCP-03:
    get:
      operationId: getMcpDispositionContext
      security: [{bearerAuth: []}]
      description: 可信身份的动作申请资格与绑定事实。unbind_mcp省略workspaceId及targetAccount时发现当前身份可申请处置的候选绑定；同时提供二者时读取该目标的完整provider清单。目标参数只选择范围，不改变调用身份或授权。隔离/下架读取动作授权范围内完整受影响清单，不接受用个人绑定子集代替。
      parameters:
        - {name: action, in: query, required: true, schema: {type: string, enum: [unbind_mcp, isolate_mcp, withdraw_mcp]}}
        - {name: resourceId, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: workspaceId, in: query, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: targetAccount, in: query, schema: {type: string, minLength: 1, maxLength: 200}}
        - $ref: '#/components/parameters/Account'
        - $ref: '#/components/parameters/Org'
      responses:
        '200':
          description: 读取前后核验同一动作资格；绑定清单完整是相对于请求的执行范围。provider可被多个账户共用，必须分别记录绑定。管理端页面不返回providerId，冻结执行时保留原始provider列表。
          content:
            application/json:
              schema:
                type: object
                required: [snapshotId, ticketType, action, resourceId, fields, preconditions]
                properties:
                  snapshotId: {type: string, minLength: 1}
                  ticketType: {type: string, enum: [MCP-03]}
                  action: {type: string, enum: [unbind_mcp, isolate_mcp, withdraw_mcp]}
                  resourceId: {type: string, minLength: 1}
                  capturedAt: {type: string, format: date-time}
                  fields:
                    type: object
                    required: [绑定清单快照ID, 绑定清单完整, 绑定清单]
                    properties:
                      绑定清单快照ID: {type: string, minLength: 1}
                      绑定清单完整: {type: boolean}
                      绑定清单:
                        type: array
                        uniqueItems: true
                        items:
                          type: object
                          required: [account, workspaceId, providerId]
                          properties:
                            account: {type: string, minLength: 1}
                            workspaceId: {type: string, minLength: 1}
                            providerId: {type: string, minLength: 1}
                  preconditions:
                    type: array
                    minItems: 1
                    description: 恰一条kind=mcp且id为本资源的非负目录修订；其他独立条件限kind/id/revision/version/sha256这些已知字段，不允许任意凭证或地址。
                    items:
                      type: object
                      required: [kind, id]
                      additionalProperties: false
                      properties:
                        kind: {type: string}
                        id: {type: string}
                        revision: {type: integer, minimum: 0}
                        version: {type: string}
                        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        '403': {description: 无当前动作申请资格或所选绑定不在范围}
        '409': {description: 清单不完整、重复绑定或歧义目录修订}
        '501': {description: UPSTREAM_UNSUPPORTED，资格/绑定清单适配尚未实现}
  /execution-contexts/SKL-04:
    get:
      operationId: getSkillWithdrawalContext
      security: [{bearerAuth: []}]
      description: 核验可信调用人对Skill的下架资格，读取当前有效版本、真实历史统计和目录修订。读取前后权限/版本变化时拒绝。不可由普通下载权限推断管理资格；未采集统计不得伪造为0。
      parameters:
        - {name: action, in: query, required: true, schema: {type: string, enum: [withdraw_skill]}}
        - {name: resourceId, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - $ref: '#/components/parameters/Account'
        - $ref: '#/components/parameters/Org'
      responses:
        '200':
          description: 不含文件路径或凭证，必须与同一身份的catalog详情当前版本相符。preconditions恰有一条同资源kind=skill的有效目录revision，其他独立条件可额外列出。
          content:
            application/json:
              schema:
                type: object
                required: [ticketType, action, resourceId, snapshotId, fields, preconditions]
                properties:
                  ticketType: {type: string, enum: [SKL-04]}
                  action: {type: string, enum: [withdraw_skill]}
                  resourceId: {type: string, minLength: 1}
                  snapshotId: {type: string, minLength: 1}
                  capturedAt: {type: string, format: date-time}
                  fields:
                    type: object
                    required: [Skill名称, 当前版本号, 历史下载次数, 历史下载人数]
                    properties:
                      Skill名称: {type: string, minLength: 1}
                      当前版本号: {type: string, minLength: 1}
                      历史下载次数: {type: integer, minimum: 0}
                      历史下载人数: {type: integer, minimum: 0}
                  preconditions:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      required: [kind, id]
                      properties:
                        kind: {type: string}
                        id: {type: string}
                        revision: {type: integer, minimum: 0}
        '403': {description: 无下架管理资格}
        '409': {description: 依据不完整、版本变化或目录修订歧义}
        '501': {description: UPSTREAM_UNSUPPORTED，管理资格/下架依据适配未实现}
  /downloads/{resultId}:
    get:
      operationId: getSkillFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResultId'
        - $ref: '#/components/parameters/Account'
        - $ref: '#/components/parameters/Org'
        - $ref: '#/components/parameters/SubjectId'
      responses:
        '200':
          description: 文件字节
          headers:
            X-Content-SHA256:
              schema:
                type: string
        '404':
          description: 流水不存在，或账户、组织与流水不一致
  /downloads/{resultId}/receipt:
    put:
      operationId: confirmSkillDelivery
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResultId'
        - $ref: '#/components/parameters/Account'
        - $ref: '#/components/parameters/Org'
        - $ref: '#/components/parameters/SubjectId'
        - name: X-Receipt-Mode
          in: header
          required: false
          description: server-settlement仅表示管理端对已完整发送字节结算，必须校验服务身份、原流水绑定、摘要及字节数，不能授权新的文件读取。此扩展需部署核验。
          schema: {type: string, enum: [server-settlement]}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Receipt'
      responses:
        '200':
          description: 执行变为 succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionState'
        '409':
          description: 摘要或字节数与预约不一致
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    SubjectId:
      name: X-Subject-Id
      in: header
      required: false
      description: 管理端从可信身份登记生成的稳定人员ID；部署支持后必须与原执行绑定及当前身份映射核对，不能仅凭此头认定有权。旧部署不能用新头绕过原账户/组织检查。
      schema: {type: string}
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema:
        type: string
    ResultId:
      name: resultId
      in: path
      required: true
      schema:
        type: string
    Account:
      name: X-Account
      in: header
      required: true
      schema:
        type: string
    Org:
      name: X-Org
      in: header
      required: true
      schema:
        type: string
  schemas:
    AgentImpact:
      type: object
      additionalProperties: false
      description: 目录/原生应用/工作区必须完全匹配。capturedAt为UTC，采集不超过5分钟，未来偏差不超过5秒。三组collected表示已读完权威清单，缺采集必须unavailable。组修订覆盖完整成员/配置及权限事实变化。
      required: [resourceId, appId, workspaceId, snapshotId, capturedAt, grants, keys, dependencies, calls30d]
      properties:
        resourceId: {type: string, minLength: 1, maxLength: 200}
        appId: {type: string, minLength: 1, maxLength: 200}
        workspaceId: {type: string, minLength: 1, maxLength: 200}
        snapshotId: {type: string, minLength: 1, maxLength: 200}
        capturedAt: {type: string, format: date-time}
        grants: {$ref: '#/components/schemas/AgentImpactIds'}
        keys: {$ref: '#/components/schemas/AgentImpactIds'}
        dependencies:
          oneOf:
            - $ref: '#/components/schemas/UncollectedAgentImpact'
            - type: object
              additionalProperties: false
              required: [state, count, revision, items]
              properties:
                state: {type: string, enum: [collected]}
                count: {type: integer, minimum: 0, description: 必须等于完整items长度}
                revision: {type: integer, minimum: 0}
                items:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [kind, id, name, change, approved, externalAllowed, fingerprint]
                    properties:
                      kind: {type: string, enum: [tool, plugin, mcp, dataset, skill]}
                      id: {type: string, minLength: 1, maxLength: 200}
                      name: {type: string, minLength: 1, maxLength: 200}
                      change: {type: string, enum: [added, removed, changed, unchanged]}
                      approved: {type: boolean}
                      externalAllowed: {type: boolean}
                      fingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
        calls30d:
          oneOf:
            - type: object
              additionalProperties: false
              required: [state, count, from, to, source]
              properties:
                state: {type: string, enum: [collected]}
                count: {type: integer, minimum: 0}
                from: {type: string, format: date-time}
                to: {type: string, format: date-time, description: UTC窗口恰30天，结束不晚于capturedAt且相差最多5分钟}
                source: {type: string, minLength: 1, maxLength: 200, description: 真实采集渠道及成功/失败/超时去重口径，禁止凭证}
            - type: object
              additionalProperties: false
              required: [state, count, from, to, reasonCode]
              properties:
                state: {type: string, enum: [unavailable]}
                count: {type: integer, nullable: true, enum: [null]}
                from: {type: string, nullable: true, enum: [null]}
                to: {type: string, nullable: true, enum: [null]}
                reasonCode: {type: string, minLength: 1, maxLength: 200}
    AgentImpactIds:
      oneOf:
        - $ref: '#/components/schemas/UncollectedAgentImpact'
        - type: object
          additionalProperties: false
          required: [state, count, revision, items]
          properties:
            state: {type: string, enum: [collected]}
            count: {type: integer, minimum: 0, description: 等于完整items长度，0只允许权威来源确认为空}
            revision: {type: integer, minimum: 0}
            items: {type: array, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 200}, description: grants为有效授权登记ID，keys为有效密钥登记ID，禁止密钥原文/产品秘密}
    UncollectedAgentImpact:
      type: object
      additionalProperties: false
      required: [state, count, revision, items, reasonCode]
      properties:
        state: {type: string, enum: [unavailable]}
        count: {type: integer, nullable: true, enum: [null]}
        revision: {type: integer, nullable: true, enum: [null]}
        items: {type: array, nullable: true, enum: [null], items: {}}
        reasonCode: {type: string, minLength: 1, maxLength: 200}
    AccountRecoveryBaseline:
      type: object
      additionalProperties: false
      description: ACC execution-contexts可选返回recoveryBaseline；缺失时允许原流程但禁止安全解锁。提交与批准必须完全一致。只含脱敏原产品事实。
      required: [ragflow, dify]
      properties:
        ragflow:
          type: object
          additionalProperties: false
          required: [accountId, account, active, permission]
          properties:
            accountId: {type: string, nullable: true}
            account: {type: string}
            active: {type: boolean}
            permission: {type: string, nullable: true, enum: ['个人', '团队成员', '管理员', null]}
        dify:
          type: object
          additionalProperties: false
          required: [accountId, workspaceId, account, active, role]
          properties:
            accountId: {type: string, nullable: true}
            workspaceId: {type: string, nullable: true}
            account: {type: string}
            active: {type: boolean}
            role: {type: string, nullable: true, enum: ['成员', '编辑', '管理员', null]}
    AccountRestorationProof:
      type: object
      additionalProperties: false
      required: [proofId, executionId, ticketNo, subjectId, identityRevision, productMappingRevision, executionStatus, sealed, outcome, checkedAt, products]
      properties:
        proofId: {type: string, minLength: 1, maxLength: 160}
        executionId: {type: string}
        ticketNo: {type: string}
        subjectId: {type: string}
        identityRevision: {type: integer}
        productMappingRevision: {type: integer}
        executionStatus: {type: string, enum: [failed, reconciling]}
        sealed: {type: boolean}
        outcome: {type: string, enum: [restored, partial, unknown]}
        checkedAt: {type: string, format: date-time}
        products:
          $ref: '#/components/schemas/AccountRecoveryBaseline'
    ExecutionRequest:
      type: "object"
      required: ["executionId", "ticketNo", "ticketType", "ticketTypeVersion", "action", "resourceId", "account", "org", "payload"]
      properties: {"executionId": {"type": "string", "pattern": "^[A-Za-z0-9_-]+$", "maxLength": 160}, "ticketNo": {"type": "string"}, "ticketType": {"type": "string"}, "ticketTypeVersion": {"type": "string", "enum": ["1"]}, "action": {"type": "string"}, "resourceId": {"type": "string"}, "account": {"type": "string"}, "org": {"type": "string"}, "payload": {"type": "object"}}
      oneOf:
        - properties:
            ticketType: {enum: [KB-01]}
            action: {enum: [sync_dataset]}
            payload: {$ref: "#/components/schemas/DecisionPayload"}
        - properties:
            ticketType: {enum: [KB-02]}
            action: {enum: [publish_dataset]}
            payload: {$ref: "#/components/schemas/DecisionPayload"}
        - properties:
            ticketType: {enum: [KB-03]}
            action: {enum: [bind_dataset]}
            payload: {$ref: "#/components/schemas/DecisionPayload"}
        - properties:
            ticketType: {enum: [KB-04]}
            action: {enum: [review_dataset_changes]}
            payload: {$ref: "#/components/schemas/DecisionPayload"}
        - properties:
            ticketType: {enum: [KB-05]}
            action: {enum: [pause_share, dispose_dataset]}
            payload: {$ref: "#/components/schemas/DecisionPayload"}
        - properties:
            ticketType: {enum: [AG-01]}
            action: {enum: [sync_app]}
            payload: {$ref: "#/components/schemas/DecisionPayload"}
        - properties:
            ticketType: {enum: [AG-02]}
            action: {enum: [publish]}
            payload: {$ref: "#/components/schemas/PublishPayload"}
        - properties:
            ticketType: {enum: [AG-03]}
            action: {enum: [grant_app_access]}
            payload: {$ref: "#/components/schemas/DecisionPayload"}
        - properties:
            ticketType: {enum: [AG-04]}
            action: {enum: [republish]}
            payload: {$ref: "#/components/schemas/DecisionPayload"}
        - properties:
            ticketType: {enum: [AG-05]}
            action: {enum: [withdraw_app]}
            payload: {$ref: "#/components/schemas/DecisionPayload"}
        - properties:
            ticketType: {enum: [KEY-01]}
            action: {enum: [create_key]}
            payload: {$ref: "#/components/schemas/DecisionPayload"}
        - properties:
            ticketType: {enum: [KEY-02]}
            action: {enum: [rotate_key, revoke_key]}
            payload: {$ref: "#/components/schemas/DecisionPayload"}
        - properties:
            ticketType: {enum: [TOL-01]}
            action: {enum: [set_tool_approval]}
            payload: {$ref: "#/components/schemas/DecisionPayload"}
        - properties:
            ticketType: {enum: [PLG-01]}
            action: {enum: [publish_package]}
            payload: {$ref: "#/components/schemas/DecisionPayload"}
        - properties:
            ticketType: {enum: [PLG-02]}
            action: {enum: [revise_package]}
            payload: {$ref: "#/components/schemas/DecisionPayload"}
        - properties:
            ticketType: {enum: [PLG-03]}
            action: {enum: [upgrade, uninstall]}
            payload: {$ref: "#/components/schemas/DecisionPayload"}
        - properties:
            ticketType: {enum: [PLG-03]}
            action: {enum: [install]}
            payload: {$ref: "#/components/schemas/InstallPayload"}
        - properties:
            ticketType: {enum: [PLG-04]}
            action: {enum: [disable_plugin, restore_plugin]}
            payload: {$ref: "#/components/schemas/DecisionPayload"}
        - properties:
            ticketType: {enum: [SKL-01]}
            action: {enum: [publish_skill]}
            payload: {$ref: "#/components/schemas/DecisionPayload"}
        - properties:
            ticketType: {enum: [SKL-02]}
            action: {enum: [revise_skill]}
            payload: {$ref: "#/components/schemas/DecisionPayload"}
        - properties:
            ticketType: {enum: [SKL-03]}
            action: {enum: [download]}
            payload: {$ref: "#/components/schemas/SkillPayload"}
        - properties:
            ticketType: {enum: [SKL-04]}
            action: {enum: [withdraw_skill]}
            payload: {$ref: "#/components/schemas/DecisionPayload"}
        - properties:
            ticketType: {enum: [MCP-01]}
            action: {enum: [register_mcp]}
            payload: {$ref: "#/components/schemas/DecisionPayload"}
        - properties:
            ticketType: {enum: [MCP-02]}
            action: {enum: [bind]}
            payload: {$ref: "#/components/schemas/BindPayload"}
        - properties:
            ticketType: {enum: [MCP-03]}
            action: {enum: [unbind_mcp, isolate_mcp, withdraw_mcp]}
            payload: {$ref: "#/components/schemas/DecisionPayload"}
        - properties:
            ticketType: {enum: [ACC-01]}
            action: {enum: [apply_account_change]}
            payload: {$ref: "#/components/schemas/DecisionPayload"}
        - properties:
            ticketType: {enum: [ACC-02]}
            action: {enum: [rename_account]}
            payload: {$ref: "#/components/schemas/DecisionPayload"}
    DecisionPayload:
      type: "object"
      required: ["decisionRef"]
      properties: {"decisionRef": {"type": "string"}}
    InstallPayload:
      type: "object"
      required: ["version", "sha256", "workspaceId"]
      properties: {"version": {"type": "string"}, "sha256": {"type": "string"}, "workspaceId": {"type": "string"}}
    BindPayload:
      type: "object"
      description: 选择目标应用时必须同时传targetAppId和decisionRef；执行器按decisionRef读取获准输入及application_target前置条件，核对同一原生应用和工作区并原子复核后配置。省略目标应用保持仅绑定到工作区的既有语义。
      required: ["workspaceId", "startsAt", "expiresAt", "expectedUrlFingerprint"]
      properties: {"workspaceId": {"type": "string"}, "startsAt": {"type": "string"}, "expiresAt": {"type": "string"}, "expectedUrlFingerprint": {"type": "string"}, "targetAppId": {"type": "string"}, "decisionRef": {"type": "string"}}
    PublishPayload:
      type: "object"
      required: ["snapshotId", "workspaceId", "publicationVersionId", "expectedRevision", "scope", "targetOrgs", "targetAccounts", "boundaryOrgs", "usages"]
      properties: {"snapshotId": {"type": "string"}, "workspaceId": {"type": "string"}, "publicationVersionId": {"type": "string"}, "expectedRevision": {"type": "integer"}, "scope": {"type": "string"}, "targetOrgs": {"type": "array", "items": {"type": "string"}}, "targetAccounts": {"type": "array", "items": {"type": "string"}}, "boundaryOrgs": {"type": "array", "items": {"type": "string"}}, "usages": {"type": "array", "items": {"type": "string"}}}
    SkillPayload:
      type: object
      required: [version, sha256]
      properties:
        version:
          type: string
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
    ExecutionState:
      type: object
      description: 严格结构与状态组合见execution-response.md。管理端不补猜执行ID/工单号/时间或结果；终态与交付绑定须匹配原冻结命令。
      required: [executionId, ticketNo, status, updatedAt, delivery, result]
      properties:
        executionId:
          type: string
          minLength: 1
          maxLength: 160
        ticketNo:
          type: string
          minLength: 1
        status:
          type: string
          enum: [queued, running, awaiting_delivery, reconciling, succeeded, failed, cancelled]
        updatedAt:
          type: string
          format: date-time
          description: UTC RFC3339，Z或+00:00，最多三位毫秒，不得相对已有有效状态倒退
        delivery:
          $ref: '#/components/schemas/Delivery'
        result:
          $ref: '#/components/schemas/ExecutionResult'
    Delivery:
      nullable: true
      type: object
      required: [resultId, version, sha256, filename, contentType, sizeBytes]
      properties:
        resultId:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '^[A-Za-z0-9_-]+$'
        version:
          type: string
        sha256:
          type: string
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: 不含路径分隔符和控制字符
        contentType:
          type: string
          maxLength: 255
        sizeBytes:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    ExecutionResult:
      nullable: true
      type: object
      required: [ok, failureCode, failureReason, retryable, resultId, version, sha256, details]
      properties:
        ok:
          type: boolean
        failureCode:
          type: string
        failureReason:
          type: string
        retryable:
          type: boolean
        resultId:
          type: string
        version:
          type: string
        sha256:
          type: string
        details:
          type: object
          properties:
            values:
              type: object
              description: Action-specific result fields; KB-04 must include the verified new catalogue state.
            deliveredAt:
              type: string
              format: date-time
    KeyRegistrationMetadata:
      type: object
      additionalProperties: false
      required: [registrationId, appId, workspaceId, lastFour, status, revision, actions]
      properties:
        registrationId: {type: string, minLength: 1, maxLength: 200}
        appId: {type: string, minLength: 1, maxLength: 200}
        workspaceId: {type: string, minLength: 1, maxLength: 200}
        keyId: {type: string, minLength: 1, maxLength: 200}
        lastFour: {type: string, minLength: 4, maxLength: 4}
        status: {type: string, enum: [active, expired, revoked, rotated, reconciling]}
        revision: {type: integer, minimum: 0}
        actions: {type: array, uniqueItems: true, items: {type: string, enum: [rotate_key, revoke_key]}}
        appName: {type: string, nullable: true, minLength: 1, maxLength: 200}
        callerName: {type: string, nullable: true, minLength: 1, maxLength: 200}
        callerOrg: {type: string, nullable: true, minLength: 1, maxLength: 200}
        environment: {type: string, nullable: true, minLength: 1, maxLength: 200}
    CatalogPage:
      type: object
      required: [items, nextCursor]
      properties:
        nextCursor:
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogEntry'
    CatalogEntry:
      type: object
      required: [resourceId, name, status, actions, data]
      properties:
        resourceId: {type: string, minLength: 1, maxLength: 200}
        name: {type: string}
        status: {type: string}
        actions:
          type: array
          uniqueItems: true
          description: 当前调用身份可用动作。智能体管理资格只接受明确的republish/withdraw_app；可见或可运行不代表有管理资格。
          items: {type: string}
        data:
          type: object
          description: 按能力组件开发第3节的种类结构返回；Skill仍须version/sha256/sizeBytes，智能体须appId/workspaceId，管理场景须原版本与流程依据。不得返回凭证。
          anyOf:
            - type: object
              required: [version, sha256, sizeBytes]
              properties:
                version: {type: string}
                sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
                sizeBytes: {type: integer, minimum: 0}
            - type: object
              required: [version, sha256, uniqueIdentifier]
              properties:
                version: {type: string}
                sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
                uniqueIdentifier: {type: string}
            - type: object
              required: [transport, toolNames]
              properties:
                transport: {type: string}
                toolNames: {type: array, items: {type: string}}
            - type: object
              required: [appId, workspaceId]
              properties:
                appId: {type: string}
                workspaceId: {type: string}
    Receipt:
      type: object
      required: [sha256, bytesSent]
      properties:
        sha256:
          type: string
        bytesSent:
          type: integer
