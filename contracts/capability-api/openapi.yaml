openapi: 3.0.3
info:
  title: 能力组件接口
  version: 0.1.0
  description: 管理系统调用。动作与 actions.json 对齐。SKL-03 已接通，插件安装按部署配置核验，其余登记动作返回 UPSTREAM_UNSUPPORTED。稳定人员交付映射及回执结算扩展需单独核验，现有执行器仍按原账户/组织匹配，不能据此宣称已支持改名交付。
servers:
  - url: /internal/v1
paths:
  /overview-summary:
    get:
      operationId: getOverviewSummary
      security: [{bearerAuth: []}]
      description: 总览独立聚合快照；只允许可信运维/管理员的当前用户网络分区，先裁剪再聚合。遵守overview-summary.md的条件空值、完整桶、去重及新鲜度约定。原observations分页协议不变；当前生产采集待实现，未采集不补零。
      parameters:
        - {name: view, in: query, required: true, schema: {type: string, enum: [monitor]}}
        - {name: scope, in: query, required: true, schema: {type: string, enum: [user_network]}}
        - {name: range, in: query, required: true, schema: {type: string, enum: [1h, 24h, 7d]}}
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: bucketMs, in: query, required: true, schema: {type: integer, enum: [300000, 3600000]}}
        - $ref: '#/components/parameters/Account'
        - $ref: '#/components/parameters/Org'
      responses:
        '200':
          description: 分组完整快照，未采集或过期有明确标记；业务统计不包含账号工单或凭证。
          content:
            application/json:
              schema: {$ref: './overview-summary.schema.json'}
        '403': {description: 无访问权限}
        '501': {description: 采集能力尚未实现}
  /resources/dify_app/{resourceId}:
    get:
      operationId: getDifyAppResourceSnapshot
      security: [{bearerAuth: []}]
      description: 按可信身份和工作区读取原生Dify应用快照。AG-04/05管理预检同时传catalogResourceId，返回该目录映射下完整agentImpact；普通应用预览可不含影响数据。不得用演示数字或部分分页替代实际清单，未接入采集使用unavailable而非0。管理操作资格仍须单独核验目录动作。
      parameters:
        - {name: resourceId, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: workspaceId, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: catalogResourceId, in: query, schema: {type: string, minLength: 1, maxLength: 200}, description: AG-04/05必传的仓库目录ID，避免原生应用对应多份目录时影响范围歧义}
        - $ref: '#/components/parameters/Account'
        - $ref: '#/components/parameters/Org'
      responses:
        '200':
          description: data含发布版本/目录修订，AG-04另需工作流快照，管理请求需合法且新鲜的agentImpact。
          content:
            application/json:
              schema:
                type: object
                required: [snapshotId, resourceId, workspaceId, capturedAt, data]
                properties:
                  snapshotId: {type: string, minLength: 1}
                  resourceId: {type: string, minLength: 1}
                  workspaceId: {type: string, minLength: 1}
                  capturedAt: {type: string, format: date-time}
                  data:
                    type: object
                    properties:
                      publicationVersionId: {type: string, minLength: 1}
                      workflowSnapshotId: {type: string, minLength: 1}
                      catalogRevision: {type: integer, minimum: 0}
                      agentImpact: {$ref: '#/components/schemas/AgentImpact'}
        '403': {description: 无该应用/工作区读取资格}
        '409': {description: 目录/原生应用映射或版本/影响依据变化}
        '501': {description: UPSTREAM_UNSUPPORTED，原生资源或完整影响适配未接入}
  /agent-replacements:
    get:
      operationId: listAgentReplacementCandidates
      security: [{bearerAuth: []}]
      description: 按可信申请人和原目录处置资格，返回可作为替代的active仓库智能体。需比较原/替代发布范围和策略兼容性，不能仅按申请人个人可见权过滤。不得返回原目录或同一原生应用的别名，不自动授予替代应用权限。
      parameters:
        - {name: sourceResourceId, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 200}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - $ref: '#/components/parameters/Account'
        - $ref: '#/components/parameters/Org'
      responses:
        '200':
          description: resourceId为仓库目录ID，跨页唯一。nextCursor必须为下一游标或null，无凭证。
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [resourceId, name]
                      properties:
                        resourceId: {type: string, minLength: 1, maxLength: 200}
                        name: {type: string, minLength: 1, maxLength: 200}
                  nextCursor: {type: string, nullable: true, minLength: 1, maxLength: 200}
        '403': {description: 原处置申请资格或替代范围不满足}
        '501': {description: UPSTREAM_UNSUPPORTED，替代目录/范围比较尚未适配}
  /agent-replacements/{resourceId}:
    get:
      operationId: getAgentReplacementContext
      security: [{bearerAuth: []}]
      description: 重新核验原处置及替代关系资格，active且audienceCompatible=true。源和替代原生应用/工作区不能相同，版本、策略或兼容依据变化必须更新revision。提交和审批均重读；执行前原子核验源目录和agent_replacement前置条件，不能沿旧策略重定向。
      parameters:
        - {name: resourceId, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: sourceResourceId, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - $ref: '#/components/parameters/Account'
        - $ref: '#/components/parameters/Org'
      responses:
        '200':
          description: 脱敏映射，revision用于冻结agent_replacement前置条件，原始凭证和工作流正文禁止返回。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [sourceResourceId, sourceAppId, sourceWorkspaceId, resourceId, appId, workspaceId, name, status, publicationVersionId, policyRef, revision, eligible, audienceCompatible]
                properties:
                  sourceResourceId: {type: string, minLength: 1, maxLength: 200}
                  sourceAppId: {type: string, minLength: 1, maxLength: 200}
                  sourceWorkspaceId: {type: string, minLength: 1, maxLength: 200}
                  resourceId: {type: string, minLength: 1, maxLength: 200}
                  appId: {type: string, minLength: 1, maxLength: 200}
                  workspaceId: {type: string, minLength: 1, maxLength: 200}
                  name: {type: string, minLength: 1, maxLength: 200}
                  status: {type: string, enum: [active]}
                  publicationVersionId: {type: string, minLength: 1, maxLength: 200}
                  policyRef: {type: string, minLength: 1, maxLength: 200}
                  revision: {type: integer, minimum: 0}
                  eligible: {type: boolean, enum: [true]}
                  audienceCompatible: {type: boolean, enum: [true]}
        '400': {description: 自替代或无效原/替代目录ID}
        '403': {description: 当前资格或范围兼容不满足}
        '409': {description: 已不可用、别名指向同一原生应用或映射/版本/策略/修订变化}
        '501': {description: UPSTREAM_UNSUPPORTED，真实替代依据尚未适配}
  /application-targets:
    get:
      operationId: listBindingApplicationTargets
      security: [{bearerAuth: []}]
      description: 按可信身份、用途及Dify工作区列出有资格关联的原生应用。dataset_publication允许待发布应用，以支持知识库先审再首次上架；关联工作区与RAG源租户分开，未发布时不产生公开知识库访问。目录可见/可运行权限不足以获得配置资格，不能从知识库或MCP使用权推断。未适配501，不用普通应用可见列表冒充。
      parameters:
        - {name: purpose, in: query, required: true, schema: {type: string, enum: [dataset_binding, mcp_binding, dataset_publication]}}
        - {name: workspaceId, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 200}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - $ref: '#/components/parameters/Account'
        - $ref: '#/components/parameters/Org'
      responses:
        '200':
          description: 全部行必须属于所选目标区；appId为Dify原生ID，不是仓库目录ID。ID跨页唯一，nextCursor必须显式为下一游标或null，无凭证/工作流正文。
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [appId, name, workspaceId]
                      properties:
                        appId: {type: string, minLength: 1, maxLength: 200}
                        name: {type: string, minLength: 1, maxLength: 200}
                        workspaceId: {type: string, minLength: 1, maxLength: 200}
                  nextCursor: {type: string, nullable: true, minLength: 1, maxLength: 200}
        '400': {description: 用途/工作区/分页参数无效}
        '403': {description: 当前身份无相应用途的配置资格}
        '501': {description: UPSTREAM_UNSUPPORTED，按用途的目标应用候选尚未适配}
  /application-targets/{appId}:
    get:
      operationId: getBindingApplicationTarget
      security: [{bearerAuth: []}]
      description: 按用途重新核验应用配置资格和原生ID/工作区映射。targetRef为跨工作区无歧义的应用登记引用，revision覆盖当前映射/配置及资格依据，相关变化须更新使旧前置条件失效。提交、审批及执行前检查；应用已删除/移区/撤权不得回退旧快照。
      parameters:
        - {name: appId, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: purpose, in: query, required: true, schema: {type: string, enum: [dataset_binding, mcp_binding, dataset_publication]}}
        - {name: workspaceId, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - $ref: '#/components/parameters/Account'
        - $ref: '#/components/parameters/Org'
      responses:
        '200':
          description: 脱敏的准确映射及资格，管理端冻结application_target/targetRef/revision。不得含实际凭证。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [appId, name, workspaceId, purpose, eligible, targetRef, revision]
                properties:
                  appId: {type: string, minLength: 1, maxLength: 200}
                  name: {type: string, minLength: 1, maxLength: 200}
                  workspaceId: {type: string, minLength: 1, maxLength: 200}
                  purpose: {type: string, enum: [dataset_binding, mcp_binding, dataset_publication]}
                  eligible: {type: boolean, enum: [true]}
                  targetRef: {type: string, minLength: 1, maxLength: 200}
                  revision: {type: integer, minimum: 0}
        '403': {description: 当前用途配置资格失效}
        '409': {description: 原生ID/用途/工作区映射或登记修订不完整或已变化}
        '501': {description: UPSTREAM_UNSUPPORTED，真实目标应用资格/登记映射尚未适配}
  /execution-contexts/KB-05/candidates:
    get:
      operationId: listDatasetDispositionCandidates
      security: [{bearerAuth: []}]
      description: 当前可信身份有人工处置申请资格的纳管/共享目录。不得以普通绑定或使用权替代；不要求申请人当前加入源工作区。未知适配501，不能以演示列表冒充。
      parameters:
        - {name: action, in: query, required: true, schema: {type: string, enum: [dispose_dataset]}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 200}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - $ref: '#/components/parameters/Account'
        - $ref: '#/components/parameters/Org'
      responses:
        '200':
          description: 源范围及原生ID独立返回，ID跨页唯一，分页终点显式null，禁止正文和凭证。
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [resourceId, name, source, sourceScopeId, sourceResourceId]
                      properties:
                        resourceId: {type: string, minLength: 1, maxLength: 200}
                        name: {type: string, minLength: 1, maxLength: 200}
                        source: {type: string, enum: [Dify, RAGFlow]}
                        sourceScopeId: {type: string, minLength: 1, maxLength: 200}
                        sourceResourceId: {type: string, minLength: 1, maxLength: 200}
                  nextCursor: {type: string, nullable: true, minLength: 1, maxLength: 200}
        '400': {description: 动作或分页参数无效}
        '403': {description: 无当前处置申请资格}
        '501': {description: UPSTREAM_UNSUPPORTED，处置候选适配尚未实现}
  /execution-contexts/KB-05:
    get:
      operationId: getDatasetDispositionContext
      security: [{bearerAuth: []}]
      description: 按处置/暂停动作及可信身份重新核验资格，eligible=true。告警来源须独立核验sourceEventId、证据和system_event身份；普通会话不能冒充告警。清单必须完整且文档ID唯一，目标清单给真实可执行映射。恰一条同目录dataset非负修订和同清单dataset_manifest哈希前置条件。暂停后的人工处置读取新前置修订，保持原文档事实与节点规则。真实执行前原子复核。
      parameters:
        - {name: action, in: query, required: true, schema: {type: string, enum: [dispose_dataset, pause_share]}}
        - {name: resourceId, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: sourceEventId, in: query, schema: {type: string, minLength: 1}}
        - $ref: '#/components/parameters/Account'
        - $ref: '#/components/parameters/Org'
      responses:
        '200':
          description: 脱敏完整事实；文档/目标/告警证据内部也只含白名单。公共预览另外删除处置目标清单，提供可用动作与可停用文档ID列表。
          content:
            application/json:
              schema:
                type: object
                required: [snapshotId, ticketType, action, resourceId, eligible, fields, preconditions]
                properties:
                  snapshotId: {type: string, minLength: 1}
                  ticketType: {type: string, enum: [KB-05]}
                  action: {type: string, enum: [dispose_dataset, pause_share]}
                  resourceId: {type: string, minLength: 1}
                  eligible: {type: boolean, enum: [true]}
                  fields:
                    type: object
                    required: [知识库名称, 来源系统, 源workspace/tenant ID, 源知识库ID, 文档清单快照ID, 清单完整, 文档清单, 影响中的授权数, 影响中的智能体数, 处置目标清单]
                    properties:
                      知识库名称: {type: string, minLength: 1}
                      来源系统: {type: string, enum: [Dify, RAGFlow]}
                      源workspace/tenant ID: {type: string, minLength: 1}
                      源知识库ID: {type: string, minLength: 1}
                      文档清单快照ID: {type: string, minLength: 1}
                      清单完整: {type: boolean, enum: [true]}
                      文档清单:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          required: [documentId, sha256]
                          properties:
                            documentId: {type: string, minLength: 1}
                            sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
                      影响中的授权数: {type: integer, minimum: 0}
                      影响中的智能体数: {type: integer, minimum: 0}
                      处置目标清单:
                        type: array
                        minItems: 1
                        items:
                          type: object
                          additionalProperties: false
                          required: [system, objectId, action]
                          properties:
                            system: {type: string, enum: [平台, Dify, RAGFlow]}
                            objectId: {type: string, minLength: 1}
                            action: {type: string, enum: [目录下架, 暂停分享, 停用文档, 撤销未到期授权]}
                            documentId: {type: string, minLength: 1, description: 仅停用文档时必填，必须匹配完整文档清单}
                      告警ID: {type: string, minLength: 1}
                      告警证据:
                        type: array
                        minItems: 1
                        items:
                          type: object
                          additionalProperties: false
                          required: [evidenceId, sha256]
                          properties:
                            evidenceId: {type: string, minLength: 1}
                            sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
                  preconditions:
                    type: array
                    minItems: 2
                    items:
                      type: object
                      additionalProperties: false
                      required: [kind, id]
                      properties:
                        kind: {type: string, minLength: 1}
                        id: {type: string, minLength: 1}
                        revision: {type: integer, minimum: 0}
                        version: {type: string}
                        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        '403': {description: 当前身份或告警源无动作资格}
        '409': {description: 来源/清单/映射不完整，前置修订歧义或状态变化}
        '501': {description: UPSTREAM_UNSUPPORTED，真实处置依据或产品映射尚未适配}
  /execution-contexts/KB-03/candidates:
    get:
      operationId: listDatasetBindingCandidates
      security: [{bearerAuth: []}]
      description: 当前身份可申请的本人已纳管私有库与已发布共享库，按目标Dify工作区、申请权限和边界过滤。不能以普通个人产品库或可见权代替共享申请资格。源范围和目标工作区独立，源区可属于他人。未适配501。
      parameters:
        - {name: action, in: query, required: true, schema: {type: string, enum: [bind_dataset]}}
        - {name: workspaceId, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: permission, in: query, schema: {type: string, enum: [检索使用, 编排绑定], default: 检索使用}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 200}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - $ref: '#/components/parameters/Account'
        - $ref: '#/components/parameters/Org'
      responses:
        '200':
          description: 所有项workspaceId为请求的目标区；resourceId为目录ID，源原生ID和源范围单列。本人纳管ownerAccount须为可信申请人。ID跨页唯一，nextCursor必须显式给出，秘密字段禁止返回。
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [resourceId, name, workspaceId, source, sourceSystem, sourceScopeId, sourceResourceId, ownerAccount]
                      properties:
                        resourceId: {type: string, minLength: 1, maxLength: 200}
                        name: {type: string, minLength: 1, maxLength: 200}
                        workspaceId: {type: string, minLength: 1, maxLength: 200}
                        source: {type: string, enum: [本人纳管, 已发布共享]}
                        sourceSystem: {type: string, enum: [Dify, RAGFlow]}
                        sourceScopeId: {type: string, minLength: 1, maxLength: 200}
                        sourceResourceId: {type: string, minLength: 1, maxLength: 200}
                        ownerAccount: {type: string, minLength: 1, maxLength: 200}
                  nextCursor: {type: string, nullable: true, minLength: 1, maxLength: 200}
        '400': {description: 目标区或申请权限无效}
        '403': {description: 无当前目标区或知识库申请资格}
        '501': {description: UPSTREAM_UNSUPPORTED，私有/共享目录或资格适配尚未实现}
  /execution-contexts/KB-03:
    get:
      operationId: getDatasetBindingContext
      security: [{bearerAuth: []}]
      description: 核验同目录ID、目标区、申请权限与身份。本人纳管目录仅本人可用；共享目录必须当前已发布且边界/权限符合。实现方式按来源系统和源/目标区关系推导。必有唯一同目录dataset_catalog非负修订；复制另须指定文档清单ID和对应哈希前置条件。提交、审批及执行前复核，目录/策略变化应更新修订使旧授权失效。秘密字段不得返回。
      parameters:
        - {name: action, in: query, required: true, schema: {type: string, enum: [bind_dataset]}}
        - {name: resourceId, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: workspaceId, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: permission, in: query, schema: {type: string, enum: [检索使用, 编排绑定], default: 检索使用}}
        - {name: targetAppId, in: query, schema: {type: string, minLength: 1, maxLength: 200}, description: 随应用发布的关联库需匹配目标原生应用，按该应用及目标workspace调用scope=app策略；无匹配上下文不能放行}
        - $ref: '#/components/parameters/Account'
        - $ref: '#/components/parameters/Org'
      responses:
        '200':
          description: 来源、权限和实现方式均为可信脱敏事实。源所有者为当前申请人即办，其余进入运维审批。
          content:
            application/json:
              schema:
                type: object
                required: [snapshotId, ticketType, action, resourceId, eligible, fields, preconditions]
                properties:
                  snapshotId: {type: string, minLength: 1}
                  ticketType: {type: string, enum: [KB-03]}
                  action: {type: string, enum: [bind_dataset]}
                  resourceId: {type: string, minLength: 1}
                  eligible: {type: boolean, enum: [true]}
                  fields:
                    type: object
                    required: [目录来源, 来源系统, 知识库名称, 源知识库ID, 源所有者账户名, 目标Dify workspace ID, 源workspace/tenant ID, 组织边界, 密级, 业务线, 允许申请权限, 实现方式, 边界匹配结果, policyRef]
                    properties:
                      目录来源: {type: string, enum: [本人纳管, 已发布共享]}
                      来源系统: {type: string, enum: [Dify, RAGFlow]}
                      知识库名称: {type: string, minLength: 1}
                      源知识库ID: {type: string, minLength: 1}
                      源所有者账户名: {type: string, minLength: 1}
                      目标Dify workspace ID: {type: string, minLength: 1}
                      源workspace/tenant ID: {type: string, minLength: 1}
                      组织边界: {type: array, minItems: 1, items: {type: string, minLength: 1}}
                      密级: {type: string, minLength: 1}
                      业务线: {type: string, minLength: 1}
                      允许申请权限: {type: array, minItems: 1, items: {type: string, enum: [检索使用, 编排绑定]}}
                      实现方式: {type: string, enum: [RAGFlow外部知识库, Dify同workspace授权, Dify跨workspace复制]}
                      外部知识库API地址: {type: string, format: uri, description: RAGFlow方式必填，可信生成的HTTP/HTTPS地址，无用户凭证/查询串/片段；认证凭证由能力端内部解析，不入工单}
                      边界匹配结果: {type: string, enum: [符合, 不符合]}
                      policyRef: {type: string, minLength: 1}
                      文档清单快照ID: {type: string, minLength: 1}
                      源文档版本指纹: {type: string, pattern: '^[a-f0-9]{64}$'}
                  preconditions:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      additionalProperties: false
                      required: [kind, id]
                      properties:
                        kind: {type: string, minLength: 1}
                        id: {type: string, minLength: 1}
                        revision: {type: integer, minimum: 0}
                        version: {type: string}
                        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        '403': {description: 当前资格/边界/申请权限不满足或他人私有目录}
        '409': {description: 来源/目标区/实现方式或目录/清单前置条件不完整或变化}
        '501': {description: UPSTREAM_UNSUPPORTED，真实绑定依据适配尚未实现}
  /execution-contexts/PLG-03/candidates:
    get:
      operationId: listPluginOperationCandidates
      security: [{bearerAuth: []}]
      description: 按可信身份、操作及目标区资格返回插件或具体安装实例。安装/升级必须提供本人可配置workspaceId；卸载可省略以发现有清理资格的旧工作区实例，不能因目录下架或批准版本消失而排除旧安装。安装installationId=null，升级/卸载为实际实例ID；相同插件多个实例以resourceId/workspaceId/installationId三元组区分。未实现501，不回退普通目录可见权限。
      parameters:
        - {name: action, in: query, required: true, schema: {type: string, enum: [install, upgrade, uninstall]}}
        - {name: operation, in: query, required: true, schema: {type: string, enum: [安装, 升级, 卸载]}}
        - {name: workspaceId, in: query, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 200}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - $ref: '#/components/parameters/Account'
        - $ref: '#/components/parameters/Org'
      responses:
        '200':
          description: 仅返回脱敏元数据。action与operation必须对应，指定工作区时每行同区。完整分页，nextCursor不能省略，三元组跨页唯一。
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [resourceId, name, source, workspaceId, installationId]
                      properties:
                        resourceId: {type: string, minLength: 1, maxLength: 200}
                        name: {type: string, minLength: 1, maxLength: 200}
                        source: {type: string, minLength: 1, maxLength: 200}
                        workspaceId: {type: string, minLength: 1, maxLength: 200}
                        installationId: {type: string, nullable: true, minLength: 1, maxLength: 200}
                  nextCursor: {type: string, nullable: true, minLength: 1, maxLength: 200}
        '400': {description: 操作错配或缺少必需工作区}
        '403': {description: 当前身份没有操作申请资格}
        '501': {description: UPSTREAM_UNSUPPORTED，插件操作候选或实例发现尚未适配}
  /execution-contexts/PLG-03:
    get:
      operationId: getPluginInstallationOperationContext
      security: [{bearerAuth: []}]
      description: 升级/卸载按选中的resourceId、workspaceId、installationId读取准确实例和当前操作资格，不得在同插件多实例中任取一个。升级提供原安装事实及目标批准版本、逐个工单升级策略和目标插件哈希前置条件；卸载版本/指纹必须等于原实例事实，不要求当前目录版本仍存在。安装依据沿用按目标workspaceId读取catalog/plugin详情。提交、审批及执行前复核，执行器原子比较实例修订并作用于该实例。
      parameters:
        - {name: action, in: query, required: true, schema: {type: string, enum: [upgrade, uninstall]}}
        - {name: resourceId, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: workspaceId, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: installationId, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - $ref: '#/components/parameters/Account'
        - $ref: '#/components/parameters/Org'
      responses:
        '200':
          description: 字段及前置条件只含脱敏事实，禁止原始凭证。安装详情另须有效名称、批准版本/哈希及installAccess。
          content:
            application/json:
              schema:
                type: object
                required: [snapshotId, ticketType, action, resourceId, eligible, fields, preconditions]
                properties:
                  snapshotId: {type: string, minLength: 1}
                  ticketType: {type: string, enum: [PLG-03]}
                  action: {type: string, enum: [upgrade, uninstall]}
                  resourceId: {type: string, minLength: 1}
                  eligible: {type: boolean, enum: [true]}
                  fields:
                    type: object
                    required: [目标Dify workspace ID, 插件名称, 批准版本号, 版本指纹, 安装实例ID, 原安装版本号, 原安装指纹, 权限匹配结果]
                    properties:
                      目标Dify workspace ID: {type: string, minLength: 1}
                      插件名称: {type: string, minLength: 1}
                      批准版本号: {type: string, minLength: 1}
                      版本指纹: {type: string, pattern: '^[a-f0-9]{64}$'}
                      安装实例ID: {type: string, minLength: 1}
                      原安装版本号: {type: string, minLength: 1}
                      原安装指纹: {type: string, pattern: '^[a-f0-9]{64}$'}
                      权限匹配结果: {type: string, enum: [免审, 需审批, 不允许]}
                      升级策略: {type: string, enum: [逐个工单升级, 仅新安装使用新版本]}
                  preconditions:
                    type: array
                    minItems: 1
                    description: 恰一条同安装实例的非负修订；升级另需同插件sha256等于目标版本指纹。不能含额外凭证字段。
                    items:
                      type: object
                      additionalProperties: false
                      required: [kind, id]
                      properties:
                        kind: {type: string}
                        id: {type: string}
                        revision: {type: integer, minimum: 0}
                        version: {type: string}
                        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        '403': {description: 当前操作申请资格失效}
        '409': {description: 实例/工作区/插件错配、前置修订歧义、版本或升级策略不满足}
        '501': {description: UPSTREAM_UNSUPPORTED，真实实例和操作资格适配尚未实现}
  /execution-contexts/TOL-01/candidates:
    get:
      operationId: listToolApprovalCandidates
      security: [{bearerAuth: []}]
      description: 统一动作候选接口的TOL-01分支。按可信身份和operation申请资格过滤。首次批准/变更再审必须提供当前可配置workspaceId；撤销可不传工作区，从授权的既有批准登记发现旧工具，不能因产品工具/工作区消失而丢失撤销入口。resourceId为工作区、提供者、原生工具映射的稳定候选标识，不能直接以原生工具ID代替。未实现501，不回退普通应用目录。
      parameters:
        - {name: action, in: query, required: true, schema: {type: string, enum: [set_tool_approval]}}
        - {name: operation, in: query, required: true, schema: {type: string, enum: [首次批准, 变更再审, 撤销批准]}}
        - {name: workspaceId, in: query, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 200}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - $ref: '#/components/parameters/Account'
        - $ref: '#/components/parameters/Org'
      responses:
        '200':
          description: 只返回脱敏候选，完整分页；ID跨页唯一，指定工作区时所有行必须同区。名单不构成执行资格证明。
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [resourceId, name, source, workspaceId]
                      properties:
                        resourceId: {type: string, minLength: 1, maxLength: 200}
                        name: {type: string, minLength: 1, maxLength: 200}
                        source: {type: string, minLength: 1, maxLength: 200}
                        workspaceId: {type: string, minLength: 1, maxLength: 200}
                  nextCursor: {type: string, nullable: true, minLength: 1, maxLength: 200}
        '400': {description: 未知操作或缺少必需工作区}
        '403': {description: 当前身份无申请资格}
        '501': {description: UPSTREAM_UNSUPPORTED，工具候选适配尚未实现}
  /execution-contexts/TOL-01:
    get:
      operationId: getToolApprovalContext
      security: [{bearerAuth: []}]
      description: 按同一稳定resourceId、workspaceId和operation复核资格并返回工具配置。操作必须回显且eligible=true。首次批准登记修订为0且无原批准工单；变更/撤销修订为正数且有原批准工单。变更必须有原版本、原指纹和脱敏配置差异。批准时再次读取比对fields及preconditions，执行器在写登记前原子核验配置和登记两个前置条件。撤销允许使用批准登记的配置快照；不能伪称已读到当前产品。schema和差异不能包含真实凭证或秘密默认值。
      parameters:
        - {name: action, in: query, required: true, schema: {type: string, enum: [set_tool_approval]}}
        - {name: operation, in: query, required: true, schema: {type: string, enum: [首次批准, 变更再审, 撤销批准]}}
        - {name: resourceId, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: workspaceId, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - $ref: '#/components/parameters/Account'
        - $ref: '#/components/parameters/Org'
      responses:
        '200':
          description: 脱敏配置及两个唯一前置条件；fields详细规则见resource-selection.md和总设计TOL-01。
          content:
            application/json:
              schema:
                type: object
                required: [snapshotId, ticketType, action, operation, eligible, resourceId, fields, preconditions]
                properties:
                  snapshotId: {type: string, minLength: 1}
                  ticketType: {type: string, enum: [TOL-01]}
                  action: {type: string, enum: [set_tool_approval]}
                  operation: {type: string, enum: [首次批准, 变更再审, 撤销批准]}
                  eligible: {type: boolean, enum: [true]}
                  resourceId: {type: string, minLength: 1}
                  capturedAt: {type: string, format: date-time}
                  fields:
                    type: object
                    required: [Dify workspace ID, Dify工具ID, Dify工具提供者ID, 工具名称, 工具提供者名称, 配置来源, 工具版本, 工具配置指纹, 输入参数schema, 输出说明]
                    properties:
                      配置来源: {type: string, enum: [产品现状, 批准登记]}
                      工具配置指纹: {type: string, pattern: '^[a-f0-9]{64}$'}
                      输入参数schema: {type: object}
                      配置差异:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          required: [差异项, 原值摘要, 新值摘要]
                          properties:
                            差异项: {type: string}
                            原值摘要: {type: string}
                            新值摘要: {type: string}
                  preconditions:
                    type: array
                    minItems: 2
                    items:
                      type: object
                      additionalProperties: false
                      required: [kind, id]
                      properties:
                        kind: {type: string}
                        id: {type: string}
                        revision: {type: integer, minimum: 0}
                        version: {type: string}
                        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        '403': {description: 当前身份对请求操作无申请资格}
        '409': {description: 工具映射、配置、批准登记修订或差异依据不完整或已变化}
        '501': {description: UPSTREAM_UNSUPPORTED，工具配置/资格/批准登记适配尚未实现}
  /key-registrations:
    get:
      operationId: listKeyRegistrationCandidates
      security: [{bearerAuth: []}]
      description: 密钥登记元数据候选，按可信账户/组织/角色和当前轮换或撤销资格过滤。不得从应用可见权限、调用方名称或浏览器账户参数推断资格。只返回有请求动作的active/expired登记，revoked/rotated/reconciling不作为新操作候选。未接入返回501，不用Dify应用目录替代。
      parameters:
        - {name: action, in: query, required: true, schema: {type: string, enum: [rotate_key, revoke_key]}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 200}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
